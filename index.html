<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoshAI — Idea to Live Product</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#fff;font-family:Inter,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;z-index:-3}
.glow{position:fixed;width:900px;height:900px;border-radius:50%;filter:blur(160px);opacity:0.18;z-index:-2;pointer-events:none}
.g1{background:radial-gradient(circle,#00E5FF,transparent 70%);top:-250px;left:-250px}
.g2{background:radial-gradient(circle,#7C3AED,transparent 70%);top:35%;right:-300px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px);position:sticky;top:0;background:rgba(5,5,7,0.8);z-index:20}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.5px}
.logo b{color:#00E5FF;font-family:'Space Grotesk',sans-serif}
.btn{padding:11px 20px;border-radius:100px;font-weight:600;cursor:pointer;border:0;transition:.2s;font-size:14px;font-family:Inter}
.btn-white{background:#fff;color:#000}
.btn-glow{background:linear-gradient(135deg,#00E5FF,#7C3AED);color:#fff;box-shadow:0 0 24px rgba(124,58,237,.4)}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;padding:70px 5% 40px;align-items:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:100px;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);color:#00E5FF;font-size:11px;letter-spacing:1.6px;margin-bottom:18px}
.dot{width:6px;height:6px;background:#00E5FF;border-radius:50%;box-shadow:0 0 10px #00E5FF;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:56px;line-height:.92;margin-bottom:18px}
.hero h1 i{font-style:normal;background:linear-gradient(90deg,#00E5FF,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Space Grotesk'}
.hero p{color:#8a8a8e;font-size:18px;line-height:1.6;max-width:540px;margin-bottom:28px}
.visual{position:relative;height:440px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.08);border-radius:28px;overflow:hidden}
.float{position:absolute;background:rgba(15,15,18,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px 16px;min-width:190px;animation:f 6s ease-in-out infinite;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.08);margin:30px 5%;border-radius:24px;overflow:hidden}
.step{background:#0B0B0E;padding:36px}.step label{color:#00E5FF;font-size:11px;letter-spacing:2px}.step h3{margin:10px 0 8px;font-size:20px}.step p{color:#6b6b70;font-size:13.5px;line-height:1.6}
.lab{margin:80px 5%;background:#0B0B0E;border:1px solid rgba(255,255,255,0.08);border-radius:24px;overflow:hidden}
.lab-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.07);flex-wrap:wrap;gap:12px}
.lab-body{display:grid;grid-template-columns:260px 1fr;height:70vh;min-height:500px}
.side{border-right:1px solid rgba(255,255,255,0.07);padding:16px;display:flex;flex-direction:column;gap:10px;background:#09090B}
.msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;transition: border 0.3s; min-height: 0;}
.bubble{max-width:82%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;direction:auto;text-align:start;}
.u{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:4px}
.a b{font-family:'Space Grotesk',sans-serif}
.bar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
.bar input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:13px 18px;color:#fff;outline:none}
.bar input:focus{border-color:#00E5FF}
.auth-overlay{position:fixed;inset:0;background:rgba(5,5,7,0.92);backdrop-filter:blur(24px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:420px;background:#0F0F12;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;box-shadow:0 20px 80px rgba(0,0,0,0.6)}
.auth-card h2{font-family:'Space Grotesk'} .auth-card input{width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;margin-bottom:12px;outline:none;font-size:14px}
.auth-card input:focus{border-color:#00E5FF}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,0.05);padding:4px;border-radius:100px}
.tab{flex:1;padding:8px;text-align:center;border-radius:100px;font-size:13px;cursor:pointer;color:#777}
.tab.active{background:#fff;color:#000;font-weight:600}
.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:#666}
.mode-switch{display:flex;background:rgba(255,255,255,0.06);padding:4px;border-radius:100px;width:fit-content}
.mode{padding:7px 14px;border-radius:100px;font-size:12px;cursor:pointer;color:#888}
.mode.active{background:#fff;color:#000;font-weight:600}
.HoshAI-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.5px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.lab-body{grid-template-columns:1fr;height:650px}.side{display:none}.hero h1{font-size:38px} .bar{padding:10px;gap:6px;} .bar input{padding:10px;font-size:13px;}}

.typing-hero{position:relative}
.typing-line{font-size:56px;line-height:.92;margin-bottom:18px;font-family:'Space Grotesk',sans-serif;font-weight:700;min-height:120px}
.typing-line i{font-style:normal;background:linear-gradient(90deg,#00E5FF,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.typing-cursor{color:#00E5FF;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.idea-dot{width:18px;height:18px;background:#00E5FF;border-radius:50%;display:inline-block;margin-left:8px;box-shadow:0 0 18px #00E5FF;vertical-align:middle}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
</head>
<body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<div id="authOverlay" class="auth-overlay" style="display:none">
<div class="auth-card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div class="logo"><span class="hoshai-brand">HoshAI</span><b>.</b></div><div style="font-size:10px;letter-spacing:1.5px;color:#00E5FF">SECURE ACCESS</div></div>
<h2 id="authTitle">Create your account</h2>
<div style="color:#777;font-size:13px;margin:6px 0 20px">Join <span class="HoshAI-brand">HoshAI</span> to chat and turn ideas into live products. Free to start.</div>
<div class="auth-tabs"><div id="tabSignup" class="tab active" onclick="switchTab('signup')">Sign Up</div><div id="tabLogin" class="tab" onclick="switchTab('login')">Log In</div></div>
<div id="authError" style="background:rgba(255,107,107,0.1);color:#ff6b6b;font-size:13px;padding:10px;border-radius:8px;margin-bottom:12px;display:none;border:1px solid rgba(255,107,107,0.3);text-align:center;"></div>
<div id="signupForm"><input id="suName" placeholder="Full name"><input id="suEmail" type="email" placeholder="Work email"><input id="suPass" type="password" placeholder="Password (min 6)" onkeydown="if(event.key==='Enter')handleSignup()"><button class="btn btn-glow" style="width:100%;margin-top:8px;padding:13px" onclick="handleSignup()">Create Account →</button></div>
<div id="loginForm" style="display:none"><input id="liEmail" type="email" placeholder="Email"><input id="liPass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin()"><button class="btn btn-white" style="width:100%;margin-top:8px;padding:13px" onclick="handleLogin()">Log In →</button></div>


<div style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;margin:14px 0"><div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div><span style="font-size:11px;color:#666">OR</span><div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div></div>
<button id="googleBtn" class="btn" style="width:100%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google</button>
<div style="font-size:11px;color:#666;margin-top:8px;text-align:center">Google login uses your secure Client ID</div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='558707911564-7rij1tf1lqkk1ofujti43plj66akcmka.apps.googleusercontent.com';
function initGoogle(){
  if(!window.google){ setTimeout(initGoogle, 500); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleGoogle });
  const btn = document.getElementById('googleBtn');
  if(btn) btn.onclick = ()=> google.accounts.id.prompt();
}
async function handleGoogle(resp){
  try{
    const r = await fetch('/api/google', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id_token: resp.credential}) });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error||'Google login failed');
    localStorage.setItem('hoshai_user', JSON.stringify(data.user));
    currentUser = data.user;
    loadUserChats();
    document.getElementById('msgs').innerHTML = ''; 
    updateAuthUI();
    document.getElementById('authOverlay').style.display='none';
  }catch(e){ showErr(e.message); }
}
window.addEventListener('DOMContentLoaded', initGoogle);
</script>

</div>
</div>
