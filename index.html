<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoshAI — Idea to Live Product</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="icon" href="logo.png" type="image/png">
<style>
:root{--bg:#212121;--sidebar:#171717;--border:rgba(255,255,255,0.08);--text:#ececec;--muted:#8e8e93}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0}
.s-top{padding:12px}
.s-logo{display:flex;align-items:center;gap:10px;padding:10px 8px;font-family:'Space Grotesk';font-weight:700;font-size:18px}
.s-logo img{width:28px;height:28px}
.btn-new{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:transparent;border:0;color:var(--text);border-radius:10px;cursor:pointer;font-size:14px;margin-top:8px}
.btn-new:hover{background:rgba(255,255,255,0.08)}
.s-history{flex:1;overflow-y:auto;padding:8px 8px}
.hist-item{padding:10px 10px;border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.hist-item:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.s-bottom{padding:12px;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.user-row:hover{background:rgba(255,255,255,0.06)}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
.model-pill{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;cursor:pointer;padding:6px 10px;border-radius:20px}
.msgs{flex:1;overflow-y:auto;padding:0;display:flex;flex-direction:column}
.msg-wrap{width:100%;display:flex;justify-content:center;padding:22px 20px}
.msg-inner{width:100%;max-width:750px;display:flex;gap:16px}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.msg-avatar.user{background:#fff;color:#000}
.msg-avatar.ai{background:linear-gradient(135deg,#E53935,#7C3AED);color:#fff;font-family:'Space Grotesk'}
.msg-content{flex:1;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;min-width:0}
.empty-center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;background:#212121}
.typing-main{font-size:32px;font-weight:700;display:flex;align-items:center;color:#fff;font-family:'Space Grotesk'}
.cursor-dot-main{width:26px;height:26px;background:#fff;border-radius:50%;margin-left:6px;animation:blink 1.1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.3}}
.composer{width:100%;display:flex;justify-content:center;padding:16px 20px 20px;background:linear-gradient(transparent, var(--bg) 30%)}
.composer-inner{width:100%;max-width:750px;background:#303030;border:1px solid var(--border);border-radius:26px;display:flex;align-items:flex-end;gap:10px;padding:10px 14px}
.composer-inner textarea{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:15px;resize:none;max-height:200px;min-height:24px;padding:6px 0;font-family:Inter}
.send-btn{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<div id="sidebar" class="sidebar">
  <div class="s-top">
    <div class="s-logo"><img src="logo.png" alt="HoshAI"/><span>HoshAI</span></div>
    <button class="btn-new" onclick="newChat()"><span>✦</span> New chat</button>
  </div>
  <div id="hist" class="s-history"></div>
  <div class="s-bottom">
    <div id="userRow" class="user-row" onclick="logout()" style="display:none">
      <div id="avatar" class="avatar">U</div>
      <div style="flex:1;min-width:0"><div id="userName" style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div style="font-size:11px;color:var(--muted)">Idea to Product</div></div>
    </div>
    <div id="loginRow" class="user-row" onclick="openAuth()"><div class="avatar">?</div><div style="font-size:13px">Log in or sign up</div></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none" class="menu-btn">☰</button>
    <div class="model-pill"><img src="logo.png" style="width:20px;height:20px"/> HoshAI <span style="font-weight:400;color:var(--muted);font-size:12px">Idea to Product</span></div>
    <div style="width:32px"></div>
  </div>
  <div id="msgs" class="msgs">
    <div id="emptyState" class="empty-center">
      <div style="margin-bottom:24px"><img src="logo.png" style="width:64px;height:64px;object-fit:contain"/></div>
      <div class="typing-main"><span id="mainTyped">Idea to Product</span><span class="cursor-dot-main"></span></div>
      <div style="color:var(--muted);margin-top:14px;font-size:14px">Turn your idea into a live product</div>
    </div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="inp" placeholder="Ask anything" rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send-btn" onclick="send()">↑</button>
    </div>
  </div>
</div>


<!-- Auth Overlay - Exact ChatGPT style with typing animation -->
<div id="authOverlay" class="auth-overlay" style="display:none">
  <div class="auth-white-screen">
    <div class="auth-topbar">
      <div style="font-size:14px">9:05 <span style="font-size:10px">◤</span></div>
      <div></div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px">5G+ 18</span></div>
    </div>
    <button class="auth-close-x" onclick="closeAuth()">✕</button>
    
    <div class="auth-typing-center">
      <div id="authTyped" class="auth-typed"><span id="authTypedText">Let's</span><span id="authCursor" class="auth-cursor-dot"></span></div>
    </div>

    <div class="auth-bottom-sheet">
      <button class="btn-apple"><span style="font-size:18px"></span> Continue with Apple</button>
      <button class="btn-google" onclick="triggerGoogle()"><span class="g-icon">G</span> Continue with Google</button>
      <button class="btn-login" onclick="showEmailForms()">Log in or sign up</button>
    </div>

    <!-- Email forms hidden initially -->
    <div id="emailForms" style="display:none;position:absolute;inset:0;background:#fff;z-index:5;padding:24px;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px"><img src="logo.png" style="width:28px;height:28px"/><b>HoshAI</b></div><button onclick="hideEmailForms()" style="width:32px;height:32px;border-radius:50%;border:1px solid #ddd;background:#f5f5f5">✕</button></div>
      <h2 id="authTitle" style="font-size:22px;font-weight:600;margin-bottom:6px">Create an account</h2>
      <div id="authError" class="auth-error"></div>
      <div id="googleBtnContainer" style="margin:12px 0"></div>
      <div id="signupForm">
        <input id="suName" placeholder="Full name" />
        <input id="suEmail" placeholder="Email address" type="email"/>
        <input id="suPass" placeholder="Password" type="password"/>
        <button class="btn-dark-full" onclick="handleSignup()">Continue</button>
        <div style="text-align:center;margin-top:14px;font-size:13px;color:#666">Already have an account? <span style="color:#000;font-weight:600;cursor:pointer" onclick="switchTab('login')">Log in</span></div>
      </div>
      <div id="loginForm" style="display:none">
        <input id="liEmail" placeholder="Email address" type="email"/>
        <input id="liPass" placeholder="Password" type="password"/>
        <button class="btn-dark-full" onclick="handleLogin()">Continue</button>
        <div style="text-align:center;margin-top:14px;font-size:13px;color:#666">Don't have an account? <span style="color:#000;font-weight:600;cursor:pointer" onclick="switchTab('signup')">Sign up</span></div>
      </div>
    </div>
  </div>
</div>

<style>
.auth-overlay{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center}
.auth-white-screen{position:relative;width:100%;max-width:430px;height:100%;background:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.auth-topbar{display:flex;justify-content:space-between;padding:12px 16px;font-weight:600;font-size:14px}
.auth-close-x{position:absolute;top:54px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;z-index:2}
.auth-typing-center{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-typed{font-size:38px;font-weight:800;letter-spacing:-1.5px;display:flex;align-items:center;gap:0;font-family:Inter, -apple-system, sans-serif;color:#000;line-height:1}
.auth-cursor-dot{width:34px;height:34px;background:#000;border-radius:50%;display:inline-block;margin-left:6px;flex-shrink:0;animation:dotPulse 1.1s infinite}
@keyframes dotPulse{0%,45%{transform:scale(1);opacity:1}50%,90%{transform:scale(0.92);opacity:0.9}95%{transform:scale(1)}}
.auth-bottom-sheet{background:#000;border-radius:28px 28px 0 0;padding:20px 16px 28px;display:flex;flex-direction:column;gap:12px}
.btn-apple{width:100%;padding:16px;background:#fff;color:#000;border-radius:100px;border:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-google{width:100%;padding:16px;background:#2a2a2a;color:#fff;border-radius:100px;border:0;font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.btn-google .g-icon{width:22px;height:22px;background:conic-gradient(from 0deg,#4285F4,#34A853,#FBBC05,#EA4335);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.btn-login{width:100%;padding:16px;background:#2a2a2a;color:#fff;border-radius:100px;border:0;font-size:17px;font-weight:500;cursor:pointer}
.btn-dark-full{width:100%;padding:14px;background:#000;color:#fff;border-radius:100px;border:0;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
.auth-white-screen input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:12px;margin-top:12px;font-size:15px;outline:none}
.auth-white-screen input:focus{border-color:#000}
.auth-error{background:#fee;border:1px solid #fcc;color:#c00;padding:12px;border-radius:12px;font-size:13px;display:none;margin-bottom:12px}
</style>


<script>
let chats=JSON.parse(localStorage.getItem('hoshai_chats_v3')||'[]');
let cur=[];let currentUser=JSON.parse(localStorage.getItem('hoshai_user')||'null');
const $=s=>document.getElementById(s);

function updateAuthUI(){
  if(currentUser){
    $('authOverlay').style.display='none';
    $('userRow').style.display='flex';
    $('loginRow').style.display='none';
    $('userName').innerText=currentUser.name||currentUser.email;
    const av=$('avatar');
    if(currentUser.picture) av.innerHTML=`<img src="${currentUser.picture}" />`; else av.innerText=(currentUser.name||'U')[0].toUpperCase();
  }else{
    $('userRow').style.display='none';
    $('loginRow').style.display='flex';
  }
  renderHist();
}

let authAnimInterval=null;
let authPhraseIndex=0;
let authCharIndex=0;
let authDeleting=false;
const authPhrases=["Let's design","Let's create","Let's discover","Let's collaborate","Let's go","Idea to Product","HoshAI"];

function openAuth(){
  $('authOverlay').style.display='flex';
  $('emailForms').style.display='none';
  startAuthTyping();
  initGoogle();
}
function closeAuth(){ $('authOverlay').style.display='none'; stopAuthTyping(); }
function showEmailForms(){ $('emailForms').style.display='block'; }
function hideEmailForms(){ $('emailForms').style.display='none'; }
function switchTab(t){
  $('emailForms').style.display='block';
  if(t==='signup'){ $('signupForm').style.display='block'; $('loginForm').style.display='none'; $('authTitle').innerText='Create an account'; }
  else { $('loginForm').style.display='block'; $('signupForm').style.display='none'; $('authTitle').innerText='Welcome back'; }
}

function startAuthTyping(){
  stopAuthTyping();
  const el=$('authTypedText');
  if(!el) return;
  let current=authPhrases[authPhraseIndex];
  function tick(){
    if(!authDeleting){
      el.textContent=current.substring(0, authCharIndex+1);
      authCharIndex++;
      if(authCharIndex===current.length){
        setTimeout(()=>{authDeleting=true; tick();}, 1200);
        return;
      }
    }else{
      el.textContent=current.substring(0, authCharIndex-1);
      authCharIndex--;
      if(authCharIndex===0){
        authDeleting=false;
        authPhraseIndex=(authPhraseIndex+1)%authPhrases.length;
        current=authPhrases[authPhraseIndex];
      }
    }
    authAnimInterval=setTimeout(tick, authDeleting? 55: 110);
  }
  tick();
}
function stopAuthTyping(){ if(authAnimInterval) clearTimeout(authAnimInterval); }

// Main page typing
const mainPhrases=["Idea to Product","Idea to Live Product","Turn Ideas into Products","Build with HoshAI","What will you build?"];
let mainIndex=0, mainChar=0, mainDel=false;
function startMainTyping(){
  const el=$('mainTyped'); if(!el) return;
  let cur=mainPhrases[mainIndex];
  function tick(){
    if(!mainDel){
      el.textContent=cur.substring(0, mainChar+1); mainChar++;
      if(mainChar===cur.length) setTimeout(()=>{mainDel=true; tick();}, 1800);
      else setTimeout(tick, 90);
    }else{
      el.textContent=cur.substring(0, mainChar-1); mainChar--;
      if(mainChar===0){ mainDel=false; mainIndex=(mainIndex+1)%mainPhrases.length; cur=mainPhrases[mainIndex]; setTimeout(tick, 400); }
      else setTimeout(tick, 50);
    }
  }
  setTimeout(tick, 800);
}
setTimeout(startMainTyping, 500);

let googleInit=false;
function initGoogle(){
  if(googleInit || typeof google==='undefined') return;
  try{
    const CLIENT_ID='558707911564-7rij1tf1lqkk1ofujti43plj66akcmka.apps.googleusercontent.com';
    if(CLIENT_ID.includes('YOUR_GOOGLE')) return;
    google.accounts.id.initialize({client_id:CLIENT_ID, callback:handleGoogleResponse});
    google.accounts.id.renderButton($('googleBtnContainer'), {theme:'outline', size:'large', width:320});
    googleInit=true;
  }catch(e){}
}
function triggerGoogle(){
  if(!googleInit) initGoogle();
  if(typeof google!=='undefined'&&google.accounts) google.accounts.id.prompt();
  else showEmailForms();
}
async function handleGoogleResponse(r){
  try{
    const res=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:r.credential})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error);
    localStorage.setItem('hoshai_user', JSON.stringify(data.user));
    currentUser=data.user; updateAuthUI(); closeAuth();
  }catch(e){ const err=$('authError'); err.innerText=e.message; err.style.display='block'; }
}
async function handleSignup(){
  const name=$('suName').value.trim(), email=$('suEmail').value.trim().toLowerCase(), pass=$('suPass').value;
  if(!name||!email||!pass){ showErr('Fill all fields'); return; }
  try{
    const res=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password:pass})});
    const data=await res.json(); if(!res.ok) throw new Error(data.error);
    localStorage.setItem('hoshai_user', JSON.stringify(data.user)); currentUser=data.user; updateAuthUI(); closeAuth();
  }catch(e){ showErr(e.message); }
}
async function handleLogin(){
  const email=$('liEmail').value.trim().toLowerCase(), pass=$('liPass').value;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const data=await res.json(); if(!res.ok) throw new Error(data.error);
    localStorage.setItem('hoshai_user', JSON.stringify(data.user)); currentUser=data.user; updateAuthUI(); closeAuth();
  }catch(e){ showErr(e.message); }
}
function logout(){ localStorage.removeItem('hoshai_user'); currentUser=null; cur=[]; $('msgs').innerHTML='<div id="emptyState" class="empty-center"><div style="margin-bottom:24px"><img src="logo.png" style="width:64px;height:64px"/></div><div class="typing-main"><span id="mainTyped">Idea to Product</span><span class="cursor-dot-main"></span></div></div>'; updateAuthUI(); startMainTyping(); }
function showErr(m){ const e=$('authError'); e.innerText=m; e.style.display='block'; }
function newChat(){ if(!currentUser){openAuth();return;} cur=[]; $('msgs').innerHTML='<div id="emptyState" class="empty-center"><div style="margin-bottom:24px"><img src="logo.png" style="width:64px;height:64px"/></div><div class="typing-main"><span id="mainTyped">Idea to Product</span><span class="cursor-dot-main"></span></div><div style="color:#8e8e93;margin-top:14px;font-size:14px">Turn your idea into a live product</div></div>'; startMainTyping(); }
function renderHist(){ const h=$('hist'); if(!h) return; h.innerHTML=''; chats.slice().reverse().slice(0,20).forEach(c=>{ const d=document.createElement('div'); d.className='hist-item'; d.innerText=c.title; h.appendChild(d); }); }

async function send(){
  if(!currentUser){openAuth();return;}
  const inp=$('inp'); const text=inp.value.trim(); if(!text) return;
  const empty=$('emptyState'); if(empty) empty.style.display='none';
  const wrap=document.createElement('div'); wrap.className='msg-wrap'; wrap.innerHTML=`<div class="msg-inner"><div class="msg-avatar user">${ (currentUser.name||'U')[0].toUpperCase() }</div><div class="msg-content">${text.replace(/</g,'&lt;')}</div></div>`;
  $('msgs').appendChild(wrap); cur.push({role:'user', content:text}); inp.value='';
  const aWrap=document.createElement('div'); aWrap.className='msg-wrap'; aWrap.innerHTML=`<div class="msg-inner"><div class="msg-avatar ai">H</div><div class="msg-content" id="stream">...</div></div>`;
  $('msgs').appendChild(aWrap); const streamEl=aWrap.querySelector('#stream');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:cur})});
    const ctype=res.headers.get('content-type')||'';
    if(ctype.includes('application/json')){
      const data=await res.json(); if(data.error){streamEl.innerHTML='<span style="color:#ff6b6b">'+data.error+'</span>'; return;}
    }
    if(!res.ok){ streamEl.textContent='Error '+res.status; return; }
    const reader=res.body.getReader(); const dec=new TextDecoder(); let full='';
    while(true){ const {done,value}=await reader.read(); if(done) break; const chunk=dec.decode(value); for(const line of chunk.split('\n')){ if(line.startsWith('data: ')){ const d=line.slice(6); if(d==='[DONE]') continue; try{ const j=JSON.parse(d); const delta=j.choices?.[0]?.delta?.content; if(delta){ full+=delta; streamEl.innerHTML=full.replace(/\n/g,'<br>').replace(/</g,'&lt;').replace(/&lt;br&gt;/g,'<br>'); $('msgs').scrollTop=999999; } }catch{} } }
    cur.push({role:'assistant', content:full}); chats.push({title:text.slice(0,40), at:Date.now()}); localStorage.setItem('hoshai_chats_v3', JSON.stringify(chats.slice(-50))); renderHist();
  }catch(e){ streamEl.textContent='Error: '+e.message; }
}
updateAuthUI();
</script>
</body>
</html>
