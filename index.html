<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoshAI — Idea to Live Product</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#fff;font-family:Inter,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;z-index:-3}
.glow{position:fixed;width:900px;height:900px;border-radius:50%;filter:blur(160px);opacity:0.18;z-index:-2;pointer-events:none}
.g1{background:radial-gradient(circle,#00E5FF,transparent 70%);top:-250px;left:-250px}
.g2{background:radial-gradient(circle,#7C3AED,transparent 70%);top:35%;right:-300px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px);position:sticky;top:0;background:rgba(5,5,7,0.8);z-index:20}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.5px}
.logo b{color:#00E5FF;font-family:'Space Grotesk',sans-serif}
.btn{padding:11px 20px;border-radius:100px;font-weight:600;cursor:pointer;border:0;transition:.2s;font-size:14px;font-family:Inter}
.btn-white{background:#fff;color:#000}
.btn-glow{background:linear-gradient(135deg,#00E5FF,#7C3AED);color:#fff;box-shadow:0 0 24px rgba(124,58,237,.4)}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;padding:70px 5% 40px;align-items:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:100px;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);color:#00E5FF;font-size:11px;letter-spacing:1.6px;margin-bottom:18px}
.dot{width:6px;height:6px;background:#00E5FF;border-radius:50%;box-shadow:0 0 10px #00E5FF;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:56px;line-height:.92;margin-bottom:18px}
.hero h1 i{font-style:normal;background:linear-gradient(90deg,#00E5FF,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Space Grotesk'}
.hero p{color:#8a8a8e;font-size:18px;line-height:1.6;max-width:540px;margin-bottom:28px}
.visual{position:relative;height:440px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.08);border-radius:28px;overflow:hidden}
.float{position:absolute;background:rgba(15,15,18,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px 16px;min-width:190px;animation:f 6s ease-in-out infinite;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.08);margin:30px 5%;border-radius:24px;overflow:hidden}
.step{background:#0B0B0E;padding:36px}.step label{color:#00E5FF;font-size:11px;letter-spacing:2px}.step h3{margin:10px 0 8px;font-size:20px}.step p{color:#6b6b70;font-size:13.5px;line-height:1.6}
.lab{margin:80px 5%;background:#0B0B0E;border:1px solid rgba(255,255,255,0.08);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;height:720px;max-height:85vh}
.lab-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.07);flex-wrap:wrap;gap:12px;flex-shrink:0}
.lab-body{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:0;overflow:hidden}
.side{border-right:1px solid rgba(255,255,255,0.07);padding:16px;display:flex;flex-direction:column;gap:10px;background:#09090B;overflow-y:auto;min-height:0}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:100%;min-height:0;scroll-behavior:smooth}
.bubble{max-width:85%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box}
.u{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:4px}
.a b{font-family:'Space Grotesk',sans-serif}
.bar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,0.07)}
.bar input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:13px 18px;color:#fff;outline:none}
.bar input:focus{border-color:#00E5FF}
.auth-overlay{position:fixed;inset:0;background:rgba(5,5,7,0.92);backdrop-filter:blur(24px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:420px;background:#0F0F12;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;box-shadow:0 20px 80px rgba(0,0,0,0.6)}
.auth-card h2{font-family:'Space Grotesk'} .auth-card input{width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;margin-bottom:12px;outline:none;font-size:14px}
.auth-card input:focus{border-color:#00E5FF}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,0.05);padding:4px;border-radius:100px}
.tab{flex:1;padding:8px;text-align:center;border-radius:100px;font-size:13px;cursor:pointer;color:#777}
.tab.active{background:#fff;color:#000;font-weight:600}
.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:#666}
.mode-switch{display:flex;background:rgba(255,255,255,0.06);padding:4px;border-radius:100px;width:fit-content}
.mode{padding:7px 14px;border-radius:100px;font-size:12px;cursor:pointer;color:#888}
.mode.active{background:#fff;color:#000;font-weight:600}
.HoshAI-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.5px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.lab-body{grid-template-columns:1fr;height:650px}.side{display:none}.hero h1{font-size:38px}}

.typing-hero{position:relative}
.typing-line{font-size:56px;line-height:.92;margin-bottom:18px;font-family:'Space Grotesk',sans-serif;font-weight:700;min-height:120px}
.typing-line i{font-style:normal;background:linear-gradient(90deg,#00E5FF,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.typing-cursor{color:#00E5FF;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.idea-dot{width:18px;height:18px;background:#00E5FF;border-radius:50%;display:inline-block;margin-left:8px;box-shadow:0 0 18px #00E5FF;vertical-align:middle}


.attach-btn,.mic-btn{width:42px;height:42px;flex-shrink:0;border-radius:100px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mic-btn.recording{background:#ff3b3b;border-color:#ff3b3b}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);padding:6px 12px;border-radius:100px;font-size:12px;color:#fff}
.file-chip button{background:none;border:none;color:#A8A9AD;cursor:pointer}
.files-preview{display:flex;gap:8px;flex-wrap:wrap;padding:8px 18px 0}
.chat-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.chat-item:hover{background:rgba(255,255,255,0.06)}
.chat-item .del{opacity:0;width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer}
.chat-item:hover .del{opacity:1}
.drag-over{outline:2px dashed #00E5FF;outline-offset:-4px}
</style>
</head>
<body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<div id="authOverlay" class="auth-overlay" style="display:none">
<div class="auth-card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div class="logo"><span class="hoshai-brand">HoshAI</span><b>.</b></div><div style="font-size:10px;letter-spacing:1.5px;color:#00E5FF">SECURE ACCESS</div></div>
<h2 id="authTitle">Create your account</h2>
<div style="color:#777;font-size:13px;margin:6px 0 20px">Join <span class="HoshAI-brand">HoshAI</span> to chat and turn ideas into live products. Free to start.</div>
<div class="auth-tabs"><div id="tabSignup" class="tab active" onclick="switchTab('signup')">Sign Up</div><div id="tabLogin" class="tab" onclick="switchTab('login')">Log In</div></div>
<div id="signupForm"><input id="suName" placeholder="Full name"><input id="suEmail" type="email" placeholder="Work email"><input id="suPass" type="password" placeholder="Password (min 6)"><button class="btn btn-glow" style="width:100%;margin-top:8px;padding:13px" onclick="handleSignup()">Create Account →</button></div>
<div id="loginForm" style="display:none"><input id="liEmail" type="email" placeholder="Email"><input id="liPass" type="password" placeholder="Password"><button class="btn btn-white" style="width:100%;margin-top:8px;padding:13px" onclick="handleLogin()">Log In →</button></div>
<div id="authError" style="color:#ff6b6b;font-size:12px;margin-top:12px;display:none"></div>

<div style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;margin:14px 0"><div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div><span style="font-size:11px;color:#666">OR</span><div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div></div>
<button id="googleBtn" class="btn" style="width:100%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google</button>
<div style="font-size:11px;color:#666;margin-top:8px;text-align:center">Google login uses your secure Client ID</div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
let cur=[]; let currentUser=JSON.parse(localStorage.getItem('hoshai_user')||'null');
let mode=localStorage.getItem('hoshai_mode')||'chat';
const $=s=>document.getElementById(s);

function getHistoryKey(){
  if(!currentUser||!currentUser.email) return 'hoshai_chats_guest';
  return 'hoshai_chats_'+currentUser.email.toLowerCase();
}
let chats=JSON.parse(localStorage.getItem(getHistoryKey())||'[]');

function setMode(m){mode=m;localStorage.setItem('hoshai_mode',m);document.querySelectorAll('.mode').forEach(e=>e.classList.remove('active'));if(m==='chat'){document.getElementById('modeChat').classList.add('active')}else{document.getElementById('modeBuild').classList.add('active')}}
setMode(mode);

function updateAuthUI(){
  if(currentUser){
    $('authOverlay').style.display='none';$('authBtn').style.display='none';$('logoutBtn').style.display='inline-block';$('userBadge').style.display='inline-block';$('userBadge').innerText='👋 '+currentUser.name;
    chats=JSON.parse(localStorage.getItem(getHistoryKey())||'[]');
    if($('msgs').children.length===0 || $('msgs').querySelector('.locked')){
      $('msgs').innerHTML='<div class="bubble a">Welcome back '+currentUser.name+'! 👋<br><br>I\'m <span class="HoshAI-brand">HoshAI</span> — your product builder.</div>';
    }
    renderHist();
  }else{
    $('userBadge').style.display='none';$('logoutBtn').style.display='none';$('authBtn').style.display='inline-block';
    $('msgs').innerHTML='<div class="locked"><div style="font-size:32px">🔒</div><h3>Authentication Required</h3><p style="font-size:13px;max-width:300px">Create a free account to chat with <span class="HoshAI-brand">HoshAI</span>.</p><button class="btn btn-white" style="margin-top:16px" onclick="openAuth()">Create Free Account</button></div>';
    const h=$('hist'); if(h) h.innerHTML='';
  }
}
function openAuth(){ $('authOverlay').style.display='flex'; }
function switchTab(t){
  if(t==='signup'){ $('tabSignup').classList.add('active');$('tabLogin').classList.remove('active');$('signupForm').style.display='block';$('loginForm').style.display='none';}
  else{ $('tabLogin').classList.add('active');$('tabSignup').classList.remove('active');$('loginForm').style.display='block';$('signupForm').style.display='none';}
}
async function handleSignup(){
  const btn=document.querySelector('#signupForm button');
  const name=document.getElementById('suName').value.trim();
  const email=document.getElementById('suEmail').value.trim().toLowerCase();
  const pass=document.getElementById('suPass').value;
  if(!name||!email||!pass){showErr('Please fill all fields');return}
  if(pass.length<6){showErr('Password min 6 chars');return}
  btn.innerText='Creating...'; btn.disabled=true;
  try{
    const res=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password:pass})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Signup failed');
    localStorage.setItem('hoshai_user',JSON.stringify(data.user));
    currentUser=data.user;
    updateAuthUI();
    document.getElementById('authOverlay').style.display='none';
  }catch(e){showErr(e.message);}finally{btn.innerText='Create Account →';btn.disabled=false;}
}
async function handleLogin(){
  const btn=document.querySelector('#loginForm button');
  const email=document.getElementById('liEmail').value.trim().toLowerCase();
  const pass=document.getElementById('liPass').value;
  if(!email||!pass){showErr('Fill email and password');return}
  btn.innerText='Logging in...'; btn.disabled=true;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Login failed');
    localStorage.setItem('hoshai_user',JSON.stringify(data.user));
    currentUser=data.user;
    updateAuthUI();
    document.getElementById('authOverlay').style.display='none';
  }catch(e){showErr(e.message);}finally{btn.innerText='Log In →';btn.disabled=false;}
}
function logout(){localStorage.removeItem('hoshai_user');currentUser=null;cur=[];updateAuthUI();}
function showErr(m){const e=$('authError');e.innerText=m;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}

function getSystemPrompt(m){
  if(m==='chat'){return `You are HoshAI, created by HoshAI.com. You are an advanced AI chatbot and product builder. You were built by HoshAI team, not by any other company. Never mention DeepSeek, OpenAI, Anthropic or any other provider. Always say you are HoshAI, powered by HoshAI Engine.`;}
  else{return `You are HoshAI Builder, the Idea to Live Product engine from HoshAI.com. You help users turn ideas into live products. Provide Vision, MVP features (5 bullets), Tech stack, Monetization, Launch steps. You are HoshAI, built by HoshAI. Never mention DeepSeek or other companies.`;}
}
function newChat(){if(!currentUser){openAuth();return}cur=[];$('msgs').innerHTML='<div class="bubble a">New <span class="HoshAI-brand">HoshAI</span> session started in '+mode+' mode. Describe your idea...</div>'}
function addBubble(role,html){const m=$('msgs');const d=document.createElement('div');d.className='bubble '+(role==='user'?'u':'a');d.innerHTML=html;m.appendChild(d);setTimeout(()=>{m.scrollTop=m.scrollHeight},60);return d}
function renderHist(){
  const h=$('hist');if(!h)return;
  chats=JSON.parse(localStorage.getItem(getHistoryKey())||'[]');
  if(!chats.length){h.innerHTML='<div style="opacity:.5;font-size:12px;padding:8px">No chats yet for this account</div>';return;}
  h.innerHTML='';
  chats.slice(-20).reverse().forEach(c=>{
    const div=document.createElement('div');div.className='chat-item';
    div.innerHTML=`<span style='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>${c.title.slice(0,28)}</span><button class='del' onclick="deleteChat('${c.title.replace(/'/g, "\'")}', event)">×</button>`;
    div.onclick=()=>{ addBubble('u',c.title); };
    h.appendChild(div);
  });
}
function deleteChat(title, ev){
  ev.stopPropagation();
  if(!confirm('Delete this chat?')) return;
  let arr=JSON.parse(localStorage.getItem(getHistoryKey())||'[]');
  arr=arr.filter(x=>x.title!==title);
  localStorage.setItem(getHistoryKey(), JSON.stringify(arr));
  renderHist();
}

let attachedFiles=[];
function handleFiles(list){for(let f of list) attachedFiles.push(f); renderFiles();}
function renderFiles(){const p=$('filesPreview');if(!p)return;if(!attachedFiles.length){p.style.display='none';p.innerHTML='';return;}p.style.display='flex';p.innerHTML=attachedFiles.map((f,i)=>`<span class='file-chip'>${f.name.slice(0,20)} <button onclick='removeFile(${i})'>×</button></span>`).join('');}
function removeFile(i){attachedFiles.splice(i,1);renderFiles();}
function clearFiles(){attachedFiles=[];const p=$('filesPreview');if(p){p.style.display='none';p.innerHTML='';}const fi=$('fileInput');if(fi)fi.value='';}

async function send(){
  if(!currentUser){openAuth();return}
  const inp=$('inp');let text=inp.value.trim();
  if(!text && !attachedFiles.length) return;
  let fileNote=''; if(attachedFiles.length) fileNote='
[Attached files: '+attachedFiles.map(f=>f.name).join(', ')+']';
  const fullText=text+fileNote;
  addBubble('user', (text||'') + (attachedFiles.length?'<br><small style=opacity:.6>'+attachedFiles.map(f=>'📎 '+f.name).join('<br>')+'</small>':''));
  cur.push({role:'user',content:fullText}); inp.value='';
  const holder=addBubble('a','<span id="stream">HoshAI is thinking...</span>');const streamEl=document.getElementById('stream');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:cur,mode,systemPrompt:getSystemPrompt(mode)})});
    if(!res.ok){const err=await res.text();throw new Error(err);}
    const reader=res.body.getReader();const dec=new TextDecoder();let full='';
    while(true){const {done,value}=await reader.read();if(done)break;const chunk=dec.decode(value);for(const line of chunk.split('
')){if(line.startsWith('data: ')){const d=line.slice(6);if(d==='[DONE]')continue;try{const j=JSON.parse(d);const delta=j.choices?.[0]?.delta?.content;if(delta){full+=delta;let html=full.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/
/g,'<br>');streamEl.innerHTML=html;}}catch{}}}}
    cur.push({role:'assistant',content:full});
    chats.push({title:text.slice(0,40)||attachedFiles.map(f=>f.name).join(', '), at:Date.now()});
    localStorage.setItem(getHistoryKey(), JSON.stringify(chats.slice(-20)));
    renderHist(); clearFiles();
  }catch(e){holder.innerHTML='<span style="color:#ff6b6b">Error: '+e.message+'</span>';}
}

(function(){
  const m=$('msgs'); const fi=$('fileInput');
  if(fi) fi.addEventListener('change', e=>handleFiles(e.target.files));
  if(m){
    m.addEventListener('dragover', e=>{e.preventDefault();m.classList.add('drag-over');});
    m.addEventListener('dragleave', e=>{m.classList.remove('drag-over');});
    m.addEventListener('drop', e=>{e.preventDefault();m.classList.remove('drag-over'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);});
  }
})();
let recognition=null,isRecording=false;
function toggleVoice(){
  const btn=$('micBtn');
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){alert('Use Chrome for voice');return;}
  if(isRecording){recognition.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang='fa-IR'; recognition.interimResults=true;
  recognition.onstart=()=>{isRecording=true;btn.classList.add('recording');btn.textContent='🔴';};
  recognition.onend=()=>{isRecording=false;btn.classList.remove('recording');btn.textContent='🎙️';};
  recognition.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; $('inp').value=t;};
  recognition.start();
}

updateAuthUI();

const TYPING_PHRASES = ["Let's design","Let's discover","Let's HoshAI","Let's Idea to Live Product","Let's Try","HoshAI"];
let tIdx=0, charIdx=0, deleting=false;
function typeLoop(){const el=document.getElementById('typingText');if(!el)return;const phrase=TYPING_PHRASES[tIdx];if(!deleting){el.innerHTML=phrase.substring(0,charIdx+1)+'<span class="idea-dot"></span>';charIdx++;if(charIdx===phrase.length){setTimeout(()=>{deleting=true;typeLoop();},1200);return;}}else{el.innerHTML=phrase.substring(0,charIdx-1)+'<span class="idea-dot"></span>';charIdx--;if(charIdx===0){deleting=false;tIdx=(tIdx+1)%TYPING_PHRASES.length;}}setTimeout(typeLoop, deleting?45:95);}
window.addEventListener('DOMContentLoaded', ()=>{ setTimeout(typeLoop, 600); });
</script>
</body>
</html>
